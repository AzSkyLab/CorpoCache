# Infrastructure Configuration
# Generated by Infrastructure MCP Server
# Documentation: https://github.com/csGIT34/infrastructure-automation
#
# ============================================================================
# AUTO-CREATED RESOURCES (not listed below, but will be provisioned):
# ============================================================================
#   - Project Key Vault (kv-{project}-{env}) - stores secrets from SQL, Function Apps, etc.
#   - Resource Group (rg-{project}-{env})
#   - Security Group: sg-{project}-{env}-readers (Reader access to resource group)
#   - Security Group: sg-{project}-{env}-secrets (Key Vault Secrets User)
#   - Security Group: sg-{project}-{env}-deployers (deployment access)
#   - Security Group: sg-{project}-{env}-data (data store access)
#   - Storage Account for each Function App (required by Azure Functions)
#
# Owners listed in metadata will be added to security groups and granted
# appropriate RBAC access to all resources.
# ============================================================================

metadata:
  project_name: corpocache
  environment: dev
  business_unit: personal
  cost_center: personal-projects
  location: centralus
  owners:
    - owner@corpocache.local

resources:
  - type: azure_sql
    name: corpocache-sql
    config:
      sku: Free
      version: "12.0"
      max_size_gb: 32
      collation: SQL_Latin1_General_CP1_CI_AS
      admin_login: sqladmin
      databases:
        - name: corpocache

  - type: function_app
    name: corpocache-api
    config:
      runtime: node
      runtime_version: "18"
      sku: Y1
      os_type: Linux

  - type: static_web_app
    name: corpocache-web
    config:
      sku_tier: Free
      sku_size: Free

  - type: keyvault
    name: corpocache-kv
    config:
      sku: standard
      soft_delete_days: 7
      purge_protection: false
      rbac_enabled: true
