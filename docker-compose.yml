services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: corpocache
      POSTGRES_USER: corpocache
      POSTGRES_PASSWORD: corpocache-dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/001_create_tables.sql:/docker-entrypoint-initdb.d/001_create_tables.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U corpocache"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      PORT: "3000"
      NODE_ENV: development
      PG_HOST: postgres
      PG_PORT: "5432"
      PG_DATABASE: corpocache
      PG_USER: corpocache
      PG_PASSWORD: corpocache-dev
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  pgdata:
