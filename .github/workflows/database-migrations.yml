name: Database Migrations

on:
  push:
    branches:
      - main
    paths:
      - 'sql/**'
  workflow_dispatch:
  workflow_call:
    secrets:
      AZURE_CREDENTIALS:
        required: true
      SQL_PASSWORD:
        required: true

env:
  SQL_SERVER: ${{ vars.SQL_SERVER }}
  SQL_DATABASE: corpocache

jobs:
  migrate:
    name: Run Migrations
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Install SQL Tools
        run: |
          curl https://packages.microsoft.com/keys/microsoft.asc | sudo tee /etc/apt/trusted.gpg.d/microsoft.asc
          curl https://packages.microsoft.com/config/ubuntu/22.04/prod.list | sudo tee /etc/apt/sources.list.d/mssql-release.list
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y mssql-tools18 unixodbc-dev
          echo "/opt/mssql-tools18/bin" >> $GITHUB_PATH

      - name: Test Connection
        run: |
          sqlcmd \
            -S ${{ env.SQL_SERVER }} \
            -d ${{ env.SQL_DATABASE }} \
            -U sqladmin \
            -P "${{ secrets.SQL_PASSWORD }}" \
            -Q "SELECT @@VERSION" \
            -C

      - name: Get Migration Files
        id: migrations
        run: |
          # List all SQL migration files in order
          MIGRATION_FILES=$(ls -1 sql/*.sql 2>/dev/null | sort)
          echo "files<<EOF" >> $GITHUB_OUTPUT
          echo "$MIGRATION_FILES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "Found migration files:"
          echo "$MIGRATION_FILES"

      - name: Run Migrations
        run: |
          echo "Running database migrations..."

          for file in sql/*.sql; do
            if [ -f "$file" ]; then
              echo "Executing: $file"
              sqlcmd \
                -S ${{ env.SQL_SERVER }} \
                -d ${{ env.SQL_DATABASE }} \
                -U sqladmin \
                -P "${{ secrets.SQL_PASSWORD }}" \
                -i "$file" \
                -C \
                -b
              echo "✓ Completed: $file"
            fi
          done

      - name: Verify Schema
        run: |
          echo "Verifying database schema..."
          sqlcmd \
            -S ${{ env.SQL_SERVER }} \
            -d ${{ env.SQL_DATABASE }} \
            -U sqladmin \
            -P "${{ secrets.SQL_PASSWORD }}" \
            -C \
            -Q "SELECT TABLE_NAME FROM INFORMATION_SCHEMA.TABLES WHERE TABLE_TYPE = 'BASE TABLE' ORDER BY TABLE_NAME"

      - name: Migration Summary
        run: |
          echo "## Database Migration Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Server:** ${{ env.SQL_SERVER }}" >> $GITHUB_STEP_SUMMARY
          echo "**Database:** ${{ env.SQL_DATABASE }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Migrations Applied" >> $GITHUB_STEP_SUMMARY
          for file in sql/*.sql; do
            if [ -f "$file" ]; then
              echo "- \`$file\`" >> $GITHUB_STEP_SUMMARY
            fi
          done
