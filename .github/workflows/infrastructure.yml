# Infrastructure Provisioning Workflow
# This workflow processes infrastructure.yaml and triggers the provisioning pipeline
# Generated by Infrastructure MCP Server

name: Infrastructure Provisioning

on:
  push:
    branches: [main]
    paths:
      - 'infrastructure.yaml'
  pull_request:
    branches: [main]
    paths:
      - 'infrastructure.yaml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod

jobs:
  validate:
    name: Validate Infrastructure Config
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.parse.outputs.environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse infrastructure.yaml
        id: parse
        run: |
          if [ ! -f infrastructure.yaml ]; then
            echo "❌ infrastructure.yaml not found"
            exit 1
          fi

          # Extract environment from yaml
          ENV=$(grep -E '^\s+environment:' infrastructure.yaml | head -1 | awk '{print $2}' | tr -d '"' | tr -d "'")

          # Use workflow input if provided, otherwise use yaml value
          if [ -n "${{ github.event.inputs.environment }}" ]; then
            ENV="${{ github.event.inputs.environment }}"
          fi

          echo "environment=${ENV:-dev}" >> $GITHUB_OUTPUT
          echo "📋 Target environment: ${ENV:-dev}"

      - name: Validate YAML syntax
        run: |
          python3 -c "import yaml; yaml.safe_load(open('infrastructure.yaml'))"
          echo "✅ YAML syntax is valid"

  submit:
    name: Submit Infrastructure Request
    needs: validate
    runs-on: ubuntu-latest
    environment: ${{ needs.validate.outputs.environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Submit to Infrastructure API
        env:
          API_URL: ${{ vars.INFRA_API_URL }}
          API_KEY: ${{ secrets.INFRA_API_KEY }}
        run: |
          echo "📤 Submitting infrastructure request..."

          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "${API_URL}/api/provision" \
            -H "Content-Type: application/yaml" \
            -H "Authorization: Bearer ${API_KEY}" \
            -d @infrastructure.yaml)

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "✅ Request submitted successfully"
            echo "$BODY" | jq '.' 2>/dev/null || echo "$BODY"

            # Extract request ID for tracking
            REQUEST_ID=$(echo "$BODY" | jq -r '.request_id // .requestId // empty')
            if [ -n "$REQUEST_ID" ]; then
              echo "📋 Request ID: $REQUEST_ID"
              echo "request_id=$REQUEST_ID" >> $GITHUB_OUTPUT
            fi
          else
            echo "❌ Request failed with status $HTTP_CODE"
            echo "$BODY"
            exit 1
          fi
