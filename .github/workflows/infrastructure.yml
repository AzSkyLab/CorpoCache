# Infrastructure GitOps Workflow
# Automatically validates and provisions infrastructure defined in infrastructure.yaml
#
# Required secrets:
#   INFRA_API_KEY - API Gateway function key for submitting requests
#   INFRA_APP_ID - GitHub App ID for triggering queue consumer
#   INFRA_APP_PRIVATE_KEY - GitHub App private key (PEM format)
#
# On PR: Validates configuration and posts a preview comment showing additions/deletions
# On merge to main: Submits infrastructure request via API Gateway and triggers processing

name: Infrastructure GitOps

on:
  push:
    branches:
      - main
    paths:
      - 'infrastructure.yaml'
  pull_request:
    paths:
      - 'infrastructure.yaml'

permissions:
  contents: read
  pull-requests: write

jobs:
  validate-and-plan:
    runs-on: ubuntu-latest
    outputs:
      validation_result: ${{ steps.validate.outputs.result }}
      plan_markdown: ${{ steps.plan.outputs.markdown }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get base branch config
        id: base
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git show origin/${{ github.base_ref }}:infrastructure.yaml > base_infrastructure.yaml 2>/dev/null || echo "" > base_infrastructure.yaml
          else
            git show HEAD~1:infrastructure.yaml > base_infrastructure.yaml 2>/dev/null || echo "" > base_infrastructure.yaml
          fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Validate infrastructure YAML
        id: validate
        run: |
          python3 << 'VALIDATEEOF'
          import yaml
          import json
          import sys
          import os

          infra_file = "infrastructure.yaml"

          if not os.path.exists(infra_file):
              print(f"::error::Infrastructure file not found: {infra_file}")
              with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                  f.write("result=failed\n")
              sys.exit(1)

          try:
              with open(infra_file, 'r') as f:
                  config = yaml.safe_load(f)
          except yaml.YAMLError as e:
              print(f"::error::Invalid YAML syntax: {e}")
              with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                  f.write("result=failed\n")
              sys.exit(1)

          errors = []

          if 'metadata' not in config:
              errors.append("Missing 'metadata' section")
          else:
              metadata = config['metadata']
              required_meta = ['project_name', 'environment', 'business_unit', 'cost_center', 'owner_email']
              for field in required_meta:
                  if field not in metadata:
                      errors.append(f"Missing metadata.{field}")

          if 'resources' not in config:
              errors.append("Missing 'resources' section")
          elif not isinstance(config.get('resources'), list):
              errors.append("'resources' must be a list")
          elif len(config.get('resources', [])) == 0:
              errors.append("'resources' list is empty")
          else:
              valid_types = ['storage_account', 'keyvault', 'postgresql', 'mongodb', 'eventhub', 'function_app', 'linux_vm', 'aks_namespace', 'static_web_app', 'azure_sql']
              for i, resource in enumerate(config['resources']):
                  if 'type' not in resource:
                      errors.append(f"Resource {i+1}: missing 'type'")
                  elif resource['type'] not in valid_types:
                      errors.append(f"Resource {i+1}: invalid type '{resource['type']}'. Valid: {', '.join(valid_types)}")
                  if 'name' not in resource:
                      errors.append(f"Resource {i+1}: missing 'name'")

          if errors:
              print("::error::Validation failed")
              for err in errors:
                  print(f"  - {err}")
              with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                  f.write("result=failed\n")
                  f.write(f"errors={json.dumps(errors)}\n")
              sys.exit(1)

          print("Validation passed!")
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write("result=passed\n")
          VALIDATEEOF

      - name: Generate Plan Preview
        id: plan
        run: |
          python3 << 'PLANEOF'
          import yaml
          import os

          def get_azure_name(rtype, rname, project, env):
              if rtype == 'storage_account':
                  return f"{project}{rname}{env}".replace('-', '').replace('_', '')[:24]
              elif rtype == 'keyvault':
                  return f"{project}-{rname}-{env}"[:24]
              elif rtype == 'postgresql':
                  return f"{project}-{rname}-{env}"
              elif rtype == 'static_web_app':
                  return f"swa-{project}-{rname}-{env}"
              elif rtype == 'azure_sql':
                  return f"{project}-{rname}-{env}"
              else:
                  return f"{rtype}-{project}-{rname}-{env}"

          with open("infrastructure.yaml", 'r') as f:
              config = yaml.safe_load(f)

          base_resources = {}
          try:
              with open("base_infrastructure.yaml", 'r') as f:
                  content = f.read().strip()
                  if content:
                      base_config = yaml.safe_load(content)
                      if base_config and 'resources' in base_config:
                          for r in base_config['resources']:
                              key = f"{r['type']}:{r['name']}"
                              base_resources[key] = r
          except:
              pass

          metadata = config['metadata']
          resources = config.get('resources', [])
          project = metadata.get('project_name', 'unknown')
          env = metadata.get('environment', 'dev')

          current_keys = set()
          for r in resources:
              key = f"{r['type']}:{r['name']}"
              current_keys.add(key)

          base_keys = set(base_resources.keys())
          added = current_keys - base_keys
          removed = base_keys - current_keys
          unchanged = current_keys & base_keys

          lines = []
          lines.append("## Infrastructure Plan Preview")
          lines.append("")
          lines.append("### Project Information")
          lines.append("| Property | Value |")
          lines.append("|----------|-------|")
          lines.append(f"| Project Name | `{metadata.get('project_name')}` |")
          lines.append(f"| Environment | `{metadata.get('environment')}` |")
          lines.append(f"| Business Unit | `{metadata.get('business_unit')}` |")
          lines.append(f"| Cost Center | `{metadata.get('cost_center')}` |")
          lines.append(f"| Owner | `{metadata.get('owner_email')}` |")
          lines.append(f"| Location | `{metadata.get('location', 'centralus')}` |")
          lines.append("")
          lines.append("### Changes Summary")
          lines.append("| Added | Removed | Unchanged |")
          lines.append("|-------|---------|-----------|")
          lines.append(f"| {len(added)} | {len(removed)} | {len(unchanged)} |")
          lines.append("")
          lines.append("### Resource Changes")
          lines.append("")
          lines.append("| Status | Type | Name | Azure Resource |")
          lines.append("|--------|------|------|----------------|")

          for r in resources:
              key = f"{r['type']}:{r['name']}"
              azure_name = get_azure_name(r['type'], r['name'], project, env)
              if key in added:
                  lines.append(f"| + **Add** | `{r['type']}` | `{r['name']}` | `{azure_name}` |")

          for key in removed:
              r = base_resources[key]
              azure_name = get_azure_name(r['type'], r['name'], project, env)
              lines.append(f"| - **Remove** | `{r['type']}` | `{r['name']}` | `{azure_name}` |")

          for r in resources:
              key = f"{r['type']}:{r['name']}"
              azure_name = get_azure_name(r['type'], r['name'], project, env)
              if key in unchanged:
                  lines.append(f"| = No change | `{r['type']}` | `{r['name']}` | `{azure_name}` |")

          lines.append("")
          lines.append("### Resource Group")
          lines.append(f"`rg-{project}-{env}`")
          lines.append("")
          lines.append("---")

          if added or removed:
              lines.append("**Warning: This PR will modify infrastructure.** Review changes carefully before merging.")
              lines.append("")
          else:
              lines.append("**No infrastructure changes detected.**")
              lines.append("")

          lines.append("**On merge to main**, these changes will be automatically applied.")

          preview = "\n".join(lines)
          with open('plan_preview.md', 'w') as f:
              f.write(preview)

          print(preview)
          PLANEOF

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = '## Infrastructure Plan\n\n';

            try {
              if (fs.existsSync('plan_preview.md')) {
                body = fs.readFileSync('plan_preview.md', 'utf8');
              } else {
                body += 'Infrastructure configuration validated successfully.\n\n';
                body += 'Merge this PR to provision the infrastructure.';
              }
            } catch (e) {
              body += 'Validation passed. See workflow summary for details.';
            }

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('Infrastructure Plan')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }

      - name: Create Job Summary
        if: always()
        run: |
          if [ -f plan_preview.md ]; then
            cat plan_preview.md >> $GITHUB_STEP_SUMMARY
          fi

  provision:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: validate-and-plan

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Submit to Infrastructure API
        id: submit
        env:
          API_KEY: ${{ secrets.INFRA_API_KEY }}
        run: |
          python3 << 'SUBMITEOF'
          import yaml
          import json
          import urllib.request
          import os

          with open("infrastructure.yaml", 'r') as f:
              yaml_content = f.read()
              config = yaml.safe_load(yaml_content)

          repo = os.environ.get('GITHUB_REPOSITORY', 'unknown')
          api_key = os.environ['API_KEY']

          api_url = f"https://func-infra-api-rrkkz6a8.azurewebsites.net/api/provision?code={api_key}"

          payload = {
              'yaml_content': yaml_content,
              'requester_email': config['metadata'].get('owner_email', 'gitops@automation')
          }

          data = json.dumps(payload).encode('utf-8')
          req = urllib.request.Request(api_url, data=data, method='POST')
          req.add_header('Content-Type', 'application/json')

          try:
              response = urllib.request.urlopen(req)
              result = json.loads(response.read().decode())

              request_id = result.get('request_id', 'unknown')
              queue_name = result.get('queue', 'unknown')

              print(f"Successfully submitted infrastructure request!")
              print(f"   Request ID: {request_id}")
              print(f"   Queue: {queue_name}")
              print(f"   Repository: {repo}")

              with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                  f.write(f"request_id={request_id}\n")

              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
                  f.write("## Infrastructure Request Submitted\n\n")
                  f.write("| Property | Value |\n")
                  f.write("|----------|-------|\n")
                  f.write(f"| Request ID | `{request_id}` |\n")
                  f.write(f"| Queue | `{queue_name}` |\n")
                  f.write(f"| Repository | `{repo}` |\n")
                  f.write(f"| Estimated Cost | `${result.get('estimated_cost', 0):.2f}/month` |\n")

          except urllib.error.HTTPError as e:
              error_body = e.read().decode()
              print(f"::error::Failed to submit: {e.code} {e.reason}")
              print(error_body)
              exit(1)
          SUBMITEOF

      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.INFRA_APP_ID }}
          private-key: ${{ secrets.INFRA_APP_PRIVATE_KEY }}
          owner: csGIT34
          repositories: infrastructure-automation

      - name: Trigger Queue Consumer
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          curl -X POST \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/csGIT34/infrastructure-automation/dispatches \
            -d '{"event_type":"infrastructure-request","client_payload":{"source":"${{ github.repository }}","sha":"${{ github.sha }}"}}'
          echo "Triggered infrastructure queue consumer"
