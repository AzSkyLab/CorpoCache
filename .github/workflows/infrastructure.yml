# Infrastructure Provisioning Workflow
# This workflow processes infrastructure.yaml and triggers the provisioning pipeline
# Generated by Infrastructure MCP Server

name: Infrastructure Provisioning

on:
  push:
    branches: [main]
    paths:
      - 'infrastructure.yaml'
  pull_request:
    branches: [main]
    paths:
      - 'infrastructure.yaml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod

jobs:
  validate:
    name: Validate Infrastructure Config
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.parse.outputs.environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse infrastructure.yaml
        id: parse
        run: |
          if [ ! -f infrastructure.yaml ]; then
            echo "❌ infrastructure.yaml not found"
            exit 1
          fi

          # Extract environment from yaml
          ENV=$(grep -E '^\s+environment:' infrastructure.yaml | head -1 | awk '{print $2}' | tr -d '"' | tr -d "'")

          # Use workflow input if provided, otherwise use yaml value
          if [ -n "${{ github.event.inputs.environment }}" ]; then
            ENV="${{ github.event.inputs.environment }}"
          fi

          echo "environment=${ENV:-dev}" >> $GITHUB_OUTPUT
          echo "📋 Target environment: ${ENV:-dev}"

      - name: Validate YAML syntax
        run: |
          python3 -c "import yaml; yaml.safe_load(open('infrastructure.yaml'))"
          echo "✅ YAML syntax is valid"

  submit:
    name: Submit Infrastructure Request
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: ${{ needs.validate.outputs.environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Submit to Infrastructure API
        id: submit
        env:
          API_KEY: ${{ secrets.INFRA_API_KEY }}
        run: |
          python << 'EOF'
          import yaml
          import json
          import urllib.request
          import os

          with open("infrastructure.yaml", 'r') as f:
              yaml_content = f.read()
              config = yaml.safe_load(yaml_content)

          repo = os.environ.get('GITHUB_REPOSITORY', 'unknown')
          api_key = os.environ['API_KEY']

          # Call the API Gateway with function key as query parameter
          api_url = f"https://func-infra-api-rrkkz6a8.azurewebsites.net/api/provision?code={api_key}"

          payload = {
              'yaml_content': yaml_content,
              'requester_email': config['metadata'].get('owner_email', 'gitops@automation')
          }

          data = json.dumps(payload).encode('utf-8')
          req = urllib.request.Request(api_url, data=data, method='POST')
          req.add_header('Content-Type', 'application/json')

          try:
              response = urllib.request.urlopen(req)
              result = json.loads(response.read().decode())

              request_id = result.get('request_id', 'unknown')
              queue_name = result.get('queue', 'unknown')

              print(f"✅ Successfully submitted infrastructure request!")
              print(f"   Request ID: {request_id}")
              print(f"   Queue: {queue_name}")
              print(f"   Repository: {repo}")

              with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                  f.write(f"request_id={request_id}\n")

              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
                  f.write("## Infrastructure Request Submitted\n\n")
                  f.write(f"| Property | Value |\n")
                  f.write(f"|----------|-------|\n")
                  f.write(f"| Request ID | `{request_id}` |\n")
                  f.write(f"| Queue | `{queue_name}` |\n")
                  f.write(f"| Repository | `{repo}` |\n")
                  f.write(f"| Estimated Cost | `${result.get('estimated_cost', 0):.2f}/month` |\n")

          except urllib.error.HTTPError as e:
              error_body = e.read().decode()
              print(f"❌ Failed to submit: {e.code} {e.reason}")
              print(error_body)
              exit(1)
          EOF
