{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "corpocache.fullname" . }}
  labels:
    {{- include "corpocache.labels" . | nindent 4 }}
  annotations:
    {{- if .Values.ingress.tls.enabled }}
    cert-manager.io/cluster-issuer: {{ .Values.ingress.tls.issuerName }}
    {{- end }}
spec:
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host }}
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "corpocache.fullname" . }}-api
                port:
                  number: 3000
          - path: /health
            pathType: Exact
            backend:
              service:
                name: {{ include "corpocache.fullname" . }}-api
                port:
                  number: 3000
          - path: /ready
            pathType: Exact
            backend:
              service:
                name: {{ include "corpocache.fullname" . }}-api
                port:
                  number: 3000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "corpocache.fullname" . }}-frontend
                port:
                  number: 80
{{- end }}
